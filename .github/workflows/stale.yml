# Stale issue automation - keeps the tracker honest.
# Issues rot: unanswered clarifications, fixed-but-unclosed bugs, and
# ideas nobody owns. This workflow expires them on a schedule instead
# of letting the backlog grow unbounded.
name: Stale

on:
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: >
            This issue has been inactive for 30 days. If it is still
            relevant, comment to keep it open; otherwise it will close
            in 7 days. Closed issues can always be reopened.
          close-issue-message: >
            Closed for inactivity. If this is still a problem, please
            open a new issue with current reproduction details.
          stale-pr-message: >
            This PR has been inactive for 30 days and will be closed in
            7 days if not updated. Draft PRs can stay open with a
            comment explaining the pause.
          exempt-issue-labels: "pinned,security,good-first-issue"
          exempt-pr-labels: "pinned,security"
          exempt-draft-pr: true
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          operations-per-run: 100
