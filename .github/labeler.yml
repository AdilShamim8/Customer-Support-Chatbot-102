# Path-based auto-labeling for pull requests
# Keeps triage fast without manual labeling discipline.
api:
  - changed-files:
      - any-glob-to-any-file: ["src/api/**", "src/api/*"]

retrieval:
  - changed-files:
      - any-glob-to-any-file: ["src/retrieval/**", "src/indexing/**", "src/parsing/**"]

generation:
  - changed-files:
      - any-glob-to-any-file: ["src/generation/**", "src/pipeline/**"]

evaluation:
  - changed-files:
      - any-glob-to-any-file: ["src/evaluation/**", "data/eval/**"]

infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - "deploy/**"
          - "monitoring/**"
          - "docker-compose*.yml"
          - "Dockerfile*"
          - "gunicorn.conf.py"

ci:
  - changed-files:
      - any-glob-to-any-file: [".github/workflows/**"]

security:
  - changed-files:
      - any-glob-to-any-file:
          - "src/api/auth.py"
          - "src/api/rate_limiter.py"
          - "SECURITY.md"
          - "docs/security/**"

documentation:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md", "mkdocs.yml"]

tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]

dependencies:
  - changed-files:
      - any-glob-to-any-file: ["requirements.txt", "pyproject.toml"]

database:
  - changed-files:
      - any-glob-to-any-file: ["migrations/**", "src/database/**", "alembic.ini"]
