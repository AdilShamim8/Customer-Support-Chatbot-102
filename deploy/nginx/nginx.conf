# Nginx edge configuration - tier 1 of defense in depth.
# Deployed as a sidecar or standalone LB node; the K8s ingress mirrors
# these directives (deploy/kubernetes/ingress.yaml).

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Core tuning (long-lived SSE-aware) ──────────────────────────────
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;             # flush tokens immediately (SSE!)
    keepalive_timeout  75s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # ── Logging: structured-ish, machine-parseable ──────────────────────
    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
      '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
      '"rt":$request_time,"urt":$upstream_response_time,'
      '"conn":"$connection","reqs":"$connection_requests",'
      '"ua":"$http_user_agent"}';
    access_log /dev/stdout json_combined;

    # ── Security headers ────────────────────────────────────────────────
    server_tokens off;

    # ── Rate limiting zones (edge enforcement) ──────────────────────────
    limit_req_zone $binary_remote_addr zone=per_ip:100m  rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:100m;

    upstream chatbot_api {
        least_conn;
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    server {
        listen 80;
        server_name _;

        # Body limits: chat payloads are tiny; reject pathological sizes
        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;

        limit_conn conn_per_ip 10;
        limit_req zone=per_ip burst=40 nodelay;

        # ── Chat endpoint: SSE-capable (stream:true in the body), so
        # buffering OFF and timeouts LONG. Exact match: sub-paths
        # (/{id} DELETE, /feedback) stay on the generic /api/ block.
        location = /api/v1/chat {
            proxy_pass http://chatbot_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;

            proxy_buffering off;            # stream tokens as they arrive
            proxy_cache off;
            proxy_read_timeout 120s;        # > worst-case generation
            proxy_send_timeout 120s;
            chunked_transfer_encoding on;
        }

        # ── Standard API paths ───────────────────────────────────────────
        location /api/ {
            proxy_pass http://chatbot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
        }

        # ── Health checks: never rate limited (LB probes depend on it) ──
        location ~ ^/(health|ready|live|metrics)$ {
            proxy_pass http://chatbot_api;
            proxy_set_header Host $host;
            access_log off;
            limit_req off;
        }

        # ── Block paths that must not exist ─────────────────────────────
        location ~ /\.git { deny all; return 404; }
        location ~ /\.env { deny all; return 404; }
    }
}
