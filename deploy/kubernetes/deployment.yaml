# Production Deployment - RAG chatbot serving tier.
#
# Scale model for 100M+ MAU (see docs/architecture/scaling-100m-users.md):
# - Stateless pods: conversation state lives in Redis, indexes in shared
#   vector stores - any pod can serve any request, enabling free horizontal
#   scale and zero-downtime rollouts (RollingUpdate, maxSurge 25%).
# - Long-lived LLM/SSE requests hold connections open, so graceful_timeout
#   (gunicorn) and terminationGracePeriodSeconds must exceed worst-case
#   generation time (120s) to drain in-flight answers during deploys.
# - Probes: /live fails fast on dead workers (restart), /ready excludes a
#   pod from Service endpoints when the vector index or Redis is degraded
#   (this is what turns infra failure into 0-downtime traffic re-routing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-api
  namespace: chatbot
  labels:
    app.kubernetes.io/name: customer-support-chatbot
    app.kubernetes.io/component: api
spec:
  replicas: 6
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-support-chatbot
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-support-chatbot
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: chatbot-api
      terminationGracePeriodSeconds: 130   # > gunicorn graceful_timeout (120s)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        # Spread replicas across zones - a zonal outage must not take the
        # whole serving tier down (this is the #1 cause of full outages).
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: customer-support-chatbot
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: ghcr.io/adilshamim8/customer-support-chatbot-102:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: chatbot-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            failureThreshold: 30   # up to 150s for index warm-up on cold boot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: customer-support-chatbot
                    app.kubernetes.io/component: api
