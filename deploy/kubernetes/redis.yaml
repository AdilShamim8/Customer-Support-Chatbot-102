# Redis - conversation memory, rate-limit counters, semantic cache.
# Single-master via the Bitnami chart in real deployments; this manifest is
# the reference shape (see deploy/terraform for the production instance).
#
# Failure semantics: chat sessions become stateless on Redis loss - users
# lose conversation history but the service stays UP (degraded, not down).
# That trade-off is deliberate; see docs/architecture/failure-modes.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: chatbot
  labels:
    app: redis
    app.kubernetes.io/name: customer-support-chatbot
    app.kubernetes.io/component: cache
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/component: cache
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.2-alpine
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 2gb
            - --maxmemory-policy
            - allkeys-lru      # evict cache before OOM: correctness > history
            - --appendonly
            - "yes"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chatbot-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "3Gi"
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: chatbot
  labels:
    app: redis
spec:
  clusterIP: None    # headless: StatefulSet stable DNS per pod
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
