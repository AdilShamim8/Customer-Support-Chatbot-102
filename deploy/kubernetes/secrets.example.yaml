# TEMPLATE ONLY - copy values into your secret manager (Vault, AWS Secrets
# Manager, GCP Secret Manager, or `kubectl create secret`) and NEVER commit
# the filled-in file. CI secret-scanning blocks any push that contains it.
#
# Provision with:
#   kubectl create secret generic chatbot-secrets -n chatbot \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --from-literal=SECRET_KEY=$(openssl rand -hex 32) \
#     --from-literal=ADMIN_API_KEY=$(openssl rand -hex 32) \
#     --from-literal=DATABASE_URL=postgresql+asyncpg://chatbot:...@postgres:5432/chatbot_db \
#     --from-literal=REDIS_PASSWORD=... \
#     --from-literal=ELASTIC_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: chatbot-secrets
  namespace: chatbot
  labels:
    app.kubernetes.io/name: customer-support-chatbot
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME"
  SECRET_KEY: "REPLACE_ME"
  ADMIN_API_KEY: "REPLACE_ME"
  COHERE_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  DATABASE_URL: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
  ELASTIC_PASSWORD: "REPLACE_ME"
