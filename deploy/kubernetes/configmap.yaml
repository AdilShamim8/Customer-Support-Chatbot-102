# Non-secret runtime configuration.
# Values here are safe to inspect; credentials live in secrets.yaml
# (provisioned from your secret manager, never committed).
apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
  namespace: chatbot
  labels:
    app.kubernetes.io/name: customer-support-chatbot
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  METRICS_ENABLED: "true"
  ENABLE_TRACING: "true"
  OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"

  # LLM behavior
  LLM_PROVIDER: "openai"
  CHAT_MODEL: "gpt-4o"
  EMBEDDING_MODEL: "text-embedding-3-small"
  EMBEDDING_DIMENSION: "1536"
  TOP_K_RETRIEVAL: "10"
  TOP_K_RERANK: "5"
  SIMILARITY_THRESHOLD: "0.7"
  MAX_RESPONSE_TOKENS: "1024"

  # Chunking
  CHUNK_SIZE: "512"
  CHUNK_OVERLAP: "64"

  # Resilience
  REQUEST_TIMEOUT_SECONDS: "30"
  LLM_MAX_RETRIES: "3"
  LLM_TIMEOUT_SECONDS: "60"
  RETRIEVAL_TIMEOUT_SECONDS: "5"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_RESET_SECONDS: "30"

  # Caching
  SEMANTIC_CACHE_ENABLED: "true"
  SEMANTIC_CACHE_TTL_SECONDS: "21600"

  # Storage endpoints (in-cluster DNS)
  REDIS_URL: "redis://redis-master.chatbot.svc.cluster.local:6379/0"
  DATABASE_URL: "postgresql+asyncpg://chatbot:REPLACED_BY_SECRET@postgres.chatbot.svc.cluster.local:5432/chatbot_db"
  ELASTICSEARCH_URL: "http://elasticsearch.chatbot.svc.cluster.local:9200"

  # Vector store
  VECTOR_STORE_TYPE: "chroma"
  CHROMA_HOST: "chroma.chatbot.svc.cluster.local"
  CHROMA_PORT: "8000"
